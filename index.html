<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zesu AI | Portfolio & Studio</title>
    <link rel="icon" type="image/png" href="shared/images/siteicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@magenta/music@1.23.1/dist/magentamusic.min.js"></script>
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600&display=swap');

        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030008;
            color: #f5f3ff;
            margin: 0;
            overflow-x: hidden;
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, .brand-font { font-family: 'Syncopate', sans-serif; }

        .brand-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            border: 2px solid #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
            object-fit: cover; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); background-color: #1a1a1a;
        }
        @media (min-width: 768px) { .brand-avatar { width: 42px; height: 42px; } }
        .group:hover .brand-avatar { transform: scale(1.12) rotate(8deg); box-shadow: 0 0 25px rgba(168, 85, 247, 0.9); }

        .lightning-bolt {
            color: #c084fc; filter: drop-shadow(0 0 20px #a855f7);
            animation: flicker 2.5s infinite; display: inline-block; transform: skewX(-10deg);
        }
        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; filter: drop-shadow(0 0 25px #a855f7) brightness(1.3); }
            20%, 24%, 55% { opacity: 0.35; filter: drop-shadow(0 0 5px #a855f7) brightness(0.8); }
        }

        /* Optimize Edilmiş Hafif Arka Plan Efekti (GPU Akif) */
        .night { position: fixed; top: 0; left: 0; width: 100%; height: 100%; transform: rotateZ(45deg); z-index: -2; pointer-events: none; will-change: transform; }
        .shooting_star {
            position: absolute; left: 50%; top: 50%; height: 2px;
            background: linear-gradient(-45deg, #a855f7, rgba(0, 0, 255, 0));
            border-radius: 999px; filter: drop-shadow(0 0 8px #a855f7);
            animation: tail 4000ms ease-in-out infinite, shooting 4000ms ease-in-out infinite;
        }
        .shooting_star:nth-child(1) { top: 5%; left: 10%; animation-delay: 0ms; }
        .shooting_star:nth-child(2) { top: 25%; left: 60%; animation-delay: 1200ms; }
        .shooting_star:nth-child(3) { top: 45%; left: 20%; animation-delay: 2400ms; }
        @keyframes tail { 0% { width: 0; } 30% { width: 120px; } 100% { width: 0; } }
        @keyframes shooting { 0% { transform: translateX(0); } 100% { transform: translateX(400px); } }

        .purple-glow { text-shadow: 0 0 20px rgba(168, 85, 247, 0.7), 0 0 40px rgba(168, 85, 247, 0.4); }
        .glass-card {
            background: rgba(18, 6, 30, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 1.2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); transform: translateZ(0);
        }
        .nav-link { position: relative; transition: color 0.3s ease; }
        .nav-link::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: #a855f7; transition: width 0.3s ease; }
        .nav-link:hover::after { width: 100%; }

        .page-content { display: none; will-change: opacity, transform; }
        .page-content.active { display: block; animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .experience-tag { background: linear-gradient(90deg, #c084fc 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }

        .roblox-icon {
            display: inline-block; width: 18px; height: 18px; background-color: currentColor;
            mask: url('https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg') no-repeat center;
            -webkit-mask: url('https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg') no-repeat center;
            mask-size: contain; -webkit-mask-size: contain;
        }

        .software-badge {
            display: flex; align-items: center; background: rgba(168, 85, 247, 0.04);
            border: 1px solid rgba(168, 85, 247, 0.12); padding: 12px 18px; border-radius: 14px;
            transition: all 0.3s ease; transform: translateZ(0);
        }
        .software-badge:hover {
            background: rgba(168, 85, 247, 0.15); border-color: rgba(168, 85, 247, 0.5);
            transform: translateY(-2px) scale(1.01); box-shadow: 0 5px 20px rgba(168, 85, 247, 0.2);
        }

        .social-link {
            display: flex; align-items: center; padding: 10px 16px;
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: rgba(255, 255, 255, 0.7); transition: all 0.3s ease;
        }
        .social-link:hover {
            transform: translateY(-3px); color: #fff; border-color: rgba(168, 85, 247, 0.6);
            background: rgba(168, 85, 247, 0.15); box-shadow: 0 6px 20px rgba(168, 85, 247, 0.3);
        }
        .social-link.instagram:hover { color: #f472b6; border-color: #f472b6; }
        .social-link.soundcloud:hover { color: #fb923c; border-color: #fb923c; }
        .social-link.roblox:hover { color: #cbd5e1; border-color: #cbd5e1; }

        .locked { overflow: hidden !important; height: 100vh; }

        /* Giriş Ekranı */
        #enter-screen {
            position: fixed; inset: 0; z-index: 100; overflow: hidden;
            background: radial-gradient(circle at 50% 40%, #17032c 0%, #030008 75%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: opacity 0.8s ease, visibility 0.8s;
        }
        #enter-screen.leaving { opacity: 0; visibility: hidden; pointer-events: none; }
        .enter-ring {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 50%;
            animation: ringPulse 3.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; pointer-events: none;
        }
        @keyframes ringPulse {
            0% { width: 100px; height: 100px; opacity: 0.8; }
            100% { width: 850px; height: 850px; opacity: 0; }
        }
        .enter-hint { animation: hintPulse 2s ease-in-out infinite; }
        @keyframes hintPulse {
            0%, 100% { opacity: 0.4; letter-spacing: 0.4em; }
            50% { opacity: 1; letter-spacing: 0.55em; }
        }

        /* Ses Kontrolcüsü */
        #volume-control {
            position: fixed; top: 80px; left: 12px; z-index: 60;
            display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 16px;
            background: rgba(18, 6, 30, 0.75); backdrop-filter: blur(15px);
            border: 1px solid rgba(168, 85, 247
